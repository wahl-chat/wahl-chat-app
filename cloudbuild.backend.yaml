# Build, verify, and promote the backend deployed from develop or main. Each
# trigger overrides _SERVICE for its environment. The candidate receives no
# traffic until the FastAPI chat route is proven to exist.
# Required trigger substitutions:
#   develop: _SERVICE=wahl-chat-backend-dev
#   main:    _SERVICE=wahl-chat-backend
steps:
  # Build context is the repo root: the uv workspace lockfile and the ingestion
  # member live outside ai-backend/, and the backend depends on that member.
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file
      - ai-backend/Dockerfile
      - --tag
      - gcr.io/${PROJECT_ID}/github.com/wahl-chat/wahl-chat-app:${COMMIT_SHA}
      - .

  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - gcr.io/${PROJECT_ID}/github.com/wahl-chat/wahl-chat-app:${COMMIT_SHA}

  # Since the ingestion split the jobs run their OWN image (no fastapi, no
  # chat-service code) — same repo-root build context for the workspace lock.
  - id: build-ingestion
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file
      - ingestion/Dockerfile
      - --tag
      - gcr.io/${PROJECT_ID}/github.com/wahl-chat/wahl-chat-ingestion:${COMMIT_SHA}
      - .

  - id: push-ingestion
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - gcr.io/${PROJECT_ID}/github.com/wahl-chat/wahl-chat-ingestion:${COMMIT_SHA}

  - id: deploy-smoke-promote
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -ceu
      - |
        gcloud run deploy "${_SERVICE}" \
          --project="${PROJECT_ID}" \
          --region="${_REGION}" \
          --image="gcr.io/${PROJECT_ID}/github.com/wahl-chat/wahl-chat-app:${COMMIT_SHA}" \
          --no-traffic \
          --tag=candidate \
          --update-labels="commit-sha=${COMMIT_SHA}" \
          --quiet

        gcloud run services describe "${_SERVICE}" \
          --project="${PROJECT_ID}" \
          --region="${_REGION}" \
          --format=json > /workspace/service.json
        candidate_url="$$(python3 -c '
        import json, sys
        traffic = json.load(sys.stdin)["status"]["traffic"]
        print(next(item["url"] for item in traffic if item.get("tag") == "candidate"))
        ' < /workspace/service.json)"
        candidate_revision="$$(python3 -c '
        import json, sys
        traffic = json.load(sys.stdin)["status"]["traffic"]
        print(next(item["revisionName"] for item in traffic if item.get("tag") == "candidate"))
        ' < /workspace/service.json)"

        curl --fail --silent --show-error \
          --retry 12 --retry-delay 2 --retry-all-errors \
          "$${candidate_url}/openapi.json" > /workspace/openapi.json
        python3 -c '
        import json
        paths = json.load(open("/workspace/openapi.json", encoding="utf-8"))["paths"]
        assert "post" in paths.get("/api/v1/chat", {}), "POST /api/v1/chat missing"
        '

        status="$$(curl --silent --show-error \
          --output /workspace/chat-response.json \
          --write-out "%{http_code}" \
          --header "Content-Type: application/json" \
          --request POST \
          --data '{}' \
          "$${candidate_url}/api/v1/chat")"
        test "$${status}" = 422 || {
          echo "Expected POST /api/v1/chat to return 422, got $${status}" >&2
          exit 1
        }

        gcloud run services update-traffic "${_SERVICE}" \
          --project="${PROJECT_ID}" \
          --region="${_REGION}" \
          --to-revisions="$${candidate_revision}=100" \
          --remove-tags=candidate \
          --quiet

  # Ingestion jobs run the ingestion image (a job sets CONNECTOR_ID; the
  # entrypoint dispatches). Terraform owns the job specs but ignores the image;
  # this step is the image authority for jobs, exactly as deploy-smoke-promote
  # is for the service. No-op until Terraform has created the ingest-* jobs.
  - id: update-ingestion-job-images
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -ceu
      - |
        jobs="$$(gcloud run jobs list \
          --project="${PROJECT_ID}" \
          --region="${_REGION}" \
          --filter="metadata.name~^ingest-" \
          --format="value(metadata.name)")"
        [ -z "$${jobs}" ] && { echo "No ingest-* jobs yet — skipping."; exit 0; }
        for job in $${jobs}; do
          gcloud run jobs update "$${job}" \
            --project="${PROJECT_ID}" \
            --region="${_REGION}" \
            --image="gcr.io/${PROJECT_ID}/github.com/wahl-chat/wahl-chat-ingestion:${COMMIT_SHA}" \
            --quiet
        done

substitutions:
  _REGION: europe-west1

options:
  logging: CLOUD_LOGGING_ONLY

timeout: 1200s
