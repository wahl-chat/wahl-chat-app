# The ruff/mypy hooks are `local` and invoke the project's uv-managed tools, so
# pre-commit runs the EXACT versions CI uses (the dev groups of the uv workspace
# members). A pinned-rev config (ruff-pre-commit / mirrors-mypy) drifts from the
# project — it previously ran ruff/mypy seven major versions behind the code and
# reported false positives — so there is one source of truth for tool versions.
#
# `uv run` executes at the workspace root, whose single environment holds both
# members' dev tools. mypy still runs per member, because each member has its
# own [tool.mypy] config and its own import graph to resolve.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff (lint)
        entry: uv run ruff check --fix
        language: system
        files: ^(ai-backend|ingestion|packages/wahlchat-common)/.*\.py$
        require_serial: true
      - id: ruff-format
        name: Ruff (format)
        entry: uv run ruff format
        language: system
        files: ^(ai-backend|ingestion|packages/wahlchat-common)/.*\.py$
        require_serial: true
      - id: mypy
        name: Mypy (ai-backend)
        # mypy needs the whole package for import resolution, so it runs on src/
        # (as CI does), not per-file. `cd` into the member so it finds that
        # member's [tool.mypy] config; the src trigger avoids a run on
        # test-only edits.
        entry: bash -c 'cd ai-backend && uv run mypy src'
        language: system
        files: ^ai-backend/src/.*\.py$
        pass_filenames: false
        require_serial: true
      - id: mypy-ingestion
        name: Mypy (ingestion)
        entry: bash -c 'cd ingestion && uv run mypy src'
        language: system
        files: ^ingestion/src/.*\.py$
        pass_filenames: false
        require_serial: true
      - id: mypy-corpus
        name: Mypy (wahlchat-common)
        entry: bash -c 'cd packages/wahlchat-common && uv run mypy src'
        language: system
        files: ^packages/wahlchat-common/src/.*\.py$
        pass_filenames: false
        require_serial: true

  # Hygiene hooks — pinned upstream (no project-tool equivalent).
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        name: Remove Trailing Whitespace
      - id: end-of-file-fixer
        name: Ensure End-of-File Newline
      - id: check-yaml
        name: Validate YAML Files
      - id: check-added-large-files
        name: Prevent Adding Large Files
