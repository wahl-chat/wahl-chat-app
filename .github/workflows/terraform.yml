# Terraform CI: plan on PRs, apply on merge — keyless via Workload Identity Federation.
#
#   PR into develop touching infra/**      -> fmt-check + validate + plan (dev)
#   push to develop (merge) touching infra -> apply dev
#   push to main touching infra            -> plan + apply prod
#
# Auth: google-github-actions/auth with WIF; no service-account keys anywhere.
# Requires repository VARIABLES (Settings -> Secrets and variables -> Actions -> Variables;
# these are identifiers, not secrets — printed by .planning/bootstrap-terraform-runner-sa.sh):
#   GCP_WIF_PROVIDER_DEV  projects/<devProjectNumber>/locations/global/workloadIdentityPools/github/providers/github-oidc
#   GCP_TF_SA_DEV         terraform-deployer@wahl-chat-dev.iam.gserviceaccount.com
#   GCP_WIF_PROVIDER_PROD projects/<prodProjectNumber>/locations/global/workloadIdentityPools/github/providers/github-oidc
#   GCP_TF_SA_PROD        terraform-deployer@wahl-chat.iam.gserviceaccount.com

name: terraform

on:
  pull_request:
    branches: [develop, main]
    paths: ["infra/**", ".github/workflows/terraform.yml"]
  push:
    branches: [develop, main]
    paths: ["infra/**", ".github/workflows/terraform.yml"]

permissions:
  contents: read
  id-token: write # WIF token exchange

# Never run two applies (or an apply and a plan holding the lock) concurrently per env.
concurrency:
  group: terraform-${{ github.base_ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  terraform:
    runs-on: ubuntu-latest
    env:
      # main (or a PR into main) targets prod; everything else targets dev.
      TF_ENV: ${{ (github.base_ref || github.ref_name) == 'main' && 'prod' || 'dev' }}
    defaults:
      run:
        working-directory: infra/envs/${{ (github.base_ref || github.ref_name) == 'main' && 'prod' || 'dev' }}

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.TF_ENV == 'prod' && vars.GCP_WIF_PROVIDER_PROD || vars.GCP_WIF_PROVIDER_DEV }}
          service_account: ${{ env.TF_ENV == 'prod' && vars.GCP_TF_SA_PROD || vars.GCP_TF_SA_DEV }}

      - name: fmt check
        working-directory: infra
        run: terraform fmt -check -recursive -diff

      - name: init
        run: terraform init -input=false

      - name: validate
        run: terraform validate -no-color

      - name: plan
        run: terraform plan -input=false -no-color -out=tfplan

      - name: apply
        if: github.event_name == 'push'
        run: terraform apply -input=false -no-color tfplan
