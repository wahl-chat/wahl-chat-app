# Seed the config collections (contexts / parties / proposed_questions) into a
# real Firestore project. Authenticates with Workload Identity Federation — no
# service-account key is stored anywhere. The seed script's SEED_TARGET=real
# guard validates the project (and requires an explicit confirmation for prod).
#
# Qdrant is NOT seeded here: the corpus is populated by the scheduled Cloud Run
# ingestion jobs (deployment planned via Terraform — see infra/README.md), with a
# one-time snapshot copy for the initial backfill — see the runbook note in
# AGENTS.md. Firestore holds only the small, version-controlled config; Qdrant
# holds the large ingested corpus.
#
# Required per-environment configuration (GitHub Environments "dev" / "prod"):
#   vars.GCP_PROJECT               target project id (dev project / "wahl-chat")
#   vars.GCP_WIF_PROVIDER          workload identity provider resource name
#   vars.GCP_SEED_SERVICE_ACCOUNT  service account the pipeline impersonates
#   vars.SEED_CONFIRM_PROJECT      prod env only: set to "wahl-chat" to confirm

name: Seed Firestore (config)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [dev, prod]
        required: true

permissions:
  contents: read
  id-token: write # required to mint the Workload Identity token

concurrency:
  group: seed-firestore-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  seed:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (Workload Identity)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SEED_SERVICE_ACCOUNT }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install backend dependencies (frozen)
        working-directory: ai-backend
        run: uv sync --locked

      - name: Seed config collections
        working-directory: ai-backend
        env:
          SEED_TARGET: real
          ENV: ${{ inputs.environment }}
          GOOGLE_CLOUD_PROJECT: ${{ vars.GCP_PROJECT }}
          # Prod requires this to equal "wahl-chat" (set on the prod Environment);
          # dev leaves it empty and the guard does not require it.
          SEED_CONFIRM_PROJECT: ${{ vars.SEED_CONFIRM_PROJECT }}
        run: uv run python ../firebase/scripts/seed_firestore.py
