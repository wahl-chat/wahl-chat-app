# Firestore rules + indexes and Storage rules: deploy on merges — keyless via Workload Identity Federation.
#
#   push to develop (merge)  -> deploy to wahl-chat-dev
#   push to main (merge)     -> deploy to wahl-chat
#
# The rules API compiles the rules before releasing them, so a ruleset that does not
# compile fails the deploy and the live rules stay as they were.
#
# No `--force`: indexes that exist in the project but not in firestore.indexes.json are
# left in place instead of deleted.
#
# Auth reuses the Terraform deployer SA and repository variables (see terraform.yml); the
# bootstrap grants it the rules and index roles too (Firebase Rules Admin, Cloud Datastore
# Index Admin).

name: firebase-rules

on:
  push:
    branches: [develop, main]
    paths:
      - "firebase/firestore.rules"
      - "firebase/firestore.indexes.json"
      - "firebase/storage.rules"
      - "firebase/firebase.json"
      - ".github/workflows/firebase-rules.yml"

permissions:
  contents: read
  id-token: write # WIF token exchange

# A deploy is never cancelled halfway; a newer merge waits for the running one.
concurrency:
  group: firebase-rules-${{ github.ref_name }}
  cancel-in-progress: false

env:
  # main targets prod; develop targets dev.
  TARGET: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.TARGET == 'prod' && vars.WORKLOAD_IDENTITY_PROVIDER_PROD || vars.WORKLOAD_IDENTITY_PROVIDER_DEV }}
          service_account: ${{ env.TARGET == 'prod' && vars.DEPLOYER_SERVICE_ACCOUNT_PROD || vars.DEPLOYER_SERVICE_ACCOUNT_DEV }}

      - name: deploy
        working-directory: firebase
        run: |
          npm install -g firebase-tools@15.18.0
          firebase deploy --only firestore:rules,firestore:indexes,storage --non-interactive --project "${TARGET}"
