# The ruff/mypy hooks are `local` and invoke the project's uv-managed tools, so
# pre-commit runs the EXACT versions CI uses (ai-backend/pyproject.toml dev
# group). A pinned-rev config (ruff-pre-commit / mirrors-mypy) drifts from the
# project — it previously ran ruff/mypy seven major versions behind the code and
# reported false positives — so there is one source of truth for tool versions.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff (lint)
        entry: uv run --project ai-backend ruff check --fix
        language: system
        files: ^ai-backend/.*\.py$
        require_serial: true
      - id: ruff-format
        name: Ruff (format)
        entry: uv run --project ai-backend ruff format
        language: system
        files: ^ai-backend/.*\.py$
        require_serial: true
      - id: mypy
        name: Mypy
        # mypy needs the whole package for import resolution, so it runs on src/
        # (as CI does), not per-file. `cd ai-backend` so it finds the [tool.mypy]
        # config in pyproject.toml; the src trigger avoids a run on test-only edits.
        entry: bash -c 'cd ai-backend && uv run mypy src'
        language: system
        files: ^ai-backend/src/.*\.py$
        pass_filenames: false
        require_serial: true

  # Hygiene hooks — pinned upstream (no project-tool equivalent).
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        name: Remove Trailing Whitespace
      - id: end-of-file-fixer
        name: Ensure End-of-File Newline
      - id: check-yaml
        name: Validate YAML Files
      - id: check-added-large-files
        name: Prevent Adding Large Files
