[project]
name = "wahlchat-evals"
version = "1.0.0"
description = "Offline evaluations of wahl.chat's generated content, run by hand before a prompt or model change. Never part of a deployed image."
authors = [{name = "wahl.chat", email = "info@wahl.chat"}]
license = {text = "PolyForm-Noncommercial-1.0.0"}
requires-python = ">=3.12,<3.13"

# Evaluates what the ingestion jobs generate, so it depends on them; nothing
# depends on it.
dependencies = [
    "ingestion",
    "wahlchat-common",
]

[tool.uv.sources]
ingestion = { workspace = true }
wahlchat-common = { workspace = true }

[dependency-groups]
dev = [
    "mypy>=1.12.0",
    "ruff>=0.8.0",
    "pytest>=8.3",
]

[tool.pytest.ini_options]
# The tests reuse the feed builder's fixtures (ingestion/tests/feed/samples.py,
# which imports only `ingestion`), as `feed.samples`, so the two `tests`
# packages never meet.
pythonpath = ["../ingestion/tests"]
addopts = "--import-mode=importlib"

[tool.mypy]
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.ruff]
line-length = 88
indent-width = 4
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = []
fixable = ["ALL"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = false
docstring-code-line-length = "dynamic"

[tool.hatch.build.targets.wheel]
packages = ["src/wahlchat_evals"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
