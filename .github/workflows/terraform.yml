# Terraform CI: plan on PRs, MANUAL apply on merges — keyless via Workload Identity Federation.
#
#   PR into develop/main touching infra/**  -> fmt-check + validate + plan (no apply, ever)
#   push to develop (merge)                 -> plan, then apply WAITS for approval (environment "dev")
#   push to main (merge)                    -> plan, then apply WAITS for approval (environment "prod")
#   push to any other branch                -> workflow does not run (see on.push.branches)
#
# The apply job applies the exact plan file produced by the plan job (artifact hand-off),
# and only after a human approves it: one-time setup in Settings -> Environments ->
# dev / prod -> Required reviewers. Without reviewers configured the environment does
# not block — set them before relying on the gate.
#
# Auth: google-github-actions/auth with WIF; no service-account keys anywhere. Two identities
# per project: PR plans run as the read-only planner (no state lock, it cannot write state);
# the merge plan and the apply run as the deployer, which GCP only lets the deploy branch use.
# Requires repository VARIABLES (Settings -> Secrets and variables -> Actions -> Variables;
# these are identifiers, not secrets — printed by .planning/bootstrap-terraform-runner-sa.sh):
#   WORKLOAD_IDENTITY_PROVIDER_DEV   projects/<devProjectNumber>/locations/global/workloadIdentityPools/github/providers/github-oidc
#   DEPLOYER_SERVICE_ACCOUNT_DEV     terraform-deployer@wahl-chat-dev.iam.gserviceaccount.com
#   PLANNER_SERVICE_ACCOUNT_DEV      terraform-planner@wahl-chat-dev.iam.gserviceaccount.com
#   WORKLOAD_IDENTITY_PROVIDER_PROD  projects/<prodProjectNumber>/locations/global/workloadIdentityPools/github/providers/github-oidc
#   DEPLOYER_SERVICE_ACCOUNT_PROD    terraform-deployer@wahl-chat.iam.gserviceaccount.com
#   PLANNER_SERVICE_ACCOUNT_PROD     terraform-planner@wahl-chat.iam.gserviceaccount.com

name: terraform

on:
  pull_request:
    branches: [develop, main]
    paths: ["infra/**", ".github/workflows/terraform.yml"]
  push:
    branches: [develop, main]
    paths: ["infra/**", ".github/workflows/terraform.yml"]

permissions:
  contents: read
  id-token: write # WIF token exchange

# Never run two applies (or an apply and a plan holding the lock) concurrently per env.
concurrency:
  group: terraform-${{ github.base_ref || github.ref_name }}
  cancel-in-progress: false

env:
  # main (or a PR into main) targets prod; everything else targets dev.
  TF_ENV: ${{ (github.base_ref || github.ref_name) == 'main' && 'prod' || 'dev' }}

jobs:
  plan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/envs/${{ (github.base_ref || github.ref_name) == 'main' && 'prod' || 'dev' }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.TF_ENV == 'prod' && vars.WORKLOAD_IDENTITY_PROVIDER_PROD || vars.WORKLOAD_IDENTITY_PROVIDER_DEV }}
          # PRs get the read-only planner; the deployer only authenticates on the deploy branch.
          service_account: >-
            ${{ github.event_name == 'pull_request'
            && (env.TF_ENV == 'prod' && vars.PLANNER_SERVICE_ACCOUNT_PROD || vars.PLANNER_SERVICE_ACCOUNT_DEV)
            || (env.TF_ENV == 'prod' && vars.DEPLOYER_SERVICE_ACCOUNT_PROD || vars.DEPLOYER_SERVICE_ACCOUNT_DEV) }}

      - name: fmt check
        working-directory: infra
        run: terraform fmt -check -recursive -diff

      - name: init
        run: terraform init -input=false

      - name: validate
        run: terraform validate -no-color

      - name: plan
        # The planner can only read the state bucket, so PR plans skip the lock.
        run: terraform plan -input=false -no-color -lock=${{ github.event_name != 'pull_request' }} -out=tfplan

      # Hand the exact plan to the apply job — what gets approved is what gets applied.
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: tfplan-${{ env.TF_ENV }}-${{ github.sha }}
          path: infra/envs/${{ env.TF_ENV }}/tfplan
          retention-days: 3
          if-no-files-found: error

  apply:
    # Merges only (never PRs), only after plan succeeded, and gated by the
    # environment's required reviewers — GitHub's equivalent of a manual job.
    if: github.event_name == 'push'
    needs: plan
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
    defaults:
      run:
        working-directory: infra/envs/${{ github.ref_name == 'main' && 'prod' || 'dev' }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.TF_ENV == 'prod' && vars.WORKLOAD_IDENTITY_PROVIDER_PROD || vars.WORKLOAD_IDENTITY_PROVIDER_DEV }}
          service_account: ${{ env.TF_ENV == 'prod' && vars.DEPLOYER_SERVICE_ACCOUNT_PROD || vars.DEPLOYER_SERVICE_ACCOUNT_DEV }}

      - name: init
        run: terraform init -input=false

      - uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ env.TF_ENV }}-${{ github.sha }}
          path: infra/envs/${{ env.TF_ENV }}

      - name: apply
        run: terraform apply -input=false -no-color tfplan
