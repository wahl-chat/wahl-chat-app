# Firestore rules + indexes and Storage rules: test on PRs, deploy on merges — keyless via
# Workload Identity Federation.
#
#   PR into develop/main touching the rules or their tests -> rules tests (emulator)
#   push to develop (merge)                                 -> rules tests, then deploy to wahl-chat-dev
#   push to main (merge)                                    -> rules tests, then deploy to wahl-chat
#
# The rules API compiles the rules before releasing them, so a ruleset that does not
# compile fails the deploy and the live rules stay as they were. Compiling says nothing
# about who may read or write what; firebase/tests checks that, minimally.
#
# No `--force`: indexes that exist in the project but not in firestore.indexes.json are
# left in place instead of deleted.
#
# Auth reuses the Terraform deployer SA and repository variables (see terraform.yml); the
# bootstrap grants it the rules and index roles too (Firebase Rules Admin, Cloud Datastore
# Index Admin).

name: firebase-rules

on:
  pull_request:
    branches: [develop, main]
    paths:
      - "firebase/firestore.rules"
      - "firebase/firestore.indexes.json"
      - "firebase/storage.rules"
      - "firebase/firebase.json"
      - "firebase/tests/**"
      - ".github/workflows/firebase-rules.yml"
  push:
    branches: [develop, main]
    paths:
      - "firebase/firestore.rules"
      - "firebase/firestore.indexes.json"
      - "firebase/storage.rules"
      - "firebase/firebase.json"
      - "firebase/tests/**"
      - ".github/workflows/firebase-rules.yml"

permissions:
  contents: read

# A deploy is never cancelled halfway; a newer merge waits for the running one.
# PR runs get a group of their own: GitHub keeps only one pending run per group,
# so a PR run sharing the deploy group would replace a merge's pending deploy.
# A new push to a PR cancels that PR's outdated run.
concurrency:
  group: firebase-rules-${{ github.event_name == 'push' && github.ref_name || format('pr-{0}', github.event.pull_request.number) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # main targets prod; develop targets dev.
  TARGET: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firebase
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # The Firestore emulator needs a JVM; firebase-tools requires Java >= 21.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: install
        run: |
          (cd tests && bun install --frozen-lockfile)
          npm install -g firebase-tools@15.18.0

      # A demo- project keeps the emulator offline; emulators:exec hands the
      # emulator's address to the tests through FIRESTORE_EMULATOR_HOST.
      - name: rules tests (emulator)
        run: firebase emulators:exec --only firestore --project demo-wahl-chat "cd tests && bun run test"

  deploy:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # WIF token exchange
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.TARGET == 'prod' && vars.WORKLOAD_IDENTITY_PROVIDER_PROD || vars.WORKLOAD_IDENTITY_PROVIDER_DEV }}
          service_account: ${{ env.TARGET == 'prod' && vars.DEPLOYER_SERVICE_ACCOUNT_PROD || vars.DEPLOYER_SERVICE_ACCOUNT_DEV }}

      - name: deploy
        working-directory: firebase
        run: |
          npm install -g firebase-tools@15.18.0
          firebase deploy --only firestore:rules,firestore:indexes,storage --non-interactive --project "${TARGET}"
